site_name: Haotian Song
site_url: https://haotian-song.github.io/
site_author: Haotian Song
site_description: NUS Physics PhD candidate working on ultracold atoms, quantum simulation and computational imaging.
nav:
  - Home: index.md
  - Quantum Research: quantum.md
  - Publications: publications.md
  - Computational Imaging: CGI.md
  - Earlier Projects:
      - Ultraluminous X-ray Sources: ULX.md
      - Radio Galaxy Classification: BCNN.md
      - Galaxy Alignment: Alignment.md
      - X-ray Transients: SFXT.md
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
plugins:
  - search
markdown_extensions:
  - attr_list
  - meta
  - pymdownx.arithmatex:
      generic: true
extra_css:
  - stylesheets/extra.css
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Haotian-Song
    - icon: fontawesome/solid/paper-plane
      link: mailto:haotian.song@u.nus.edu
copyright: Copyright © 2026 Haotian Song
